[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parmana-verifier"
version = "1.6.2"
description = "Offline verifier for Parmana Execution Trust Records (Python)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
parmana-verify = "parmana_verifier.cli:main"

[project.urls]
Repository = "https://github.com/pavancharak/parmana-verifier"

[tool.setuptools.packages.find]
include = ["parmana_verifier*"]
