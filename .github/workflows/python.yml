name: Python verifier

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[test]"
      - name: Run tests
        run: .venv/bin/python -m pytest -q
